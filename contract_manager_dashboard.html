<script>
// Mostra/nascondi sezione profilo
function showProfile() {
  document.getElementById('profile-wrap').style.display = '';
  document.getElementById('contracts-table-wrap').style.display = 'none';
  document.getElementById('companies-table-wrap').style.display = 'none';
  // Carica dati utente
  window.supabaseClient.auth.getUser().then(({ data: { user } }) => {
    document.getElementById('pf-email').value = user?.email || '';
  });
}

// Gestione update profilo
document.getElementById('profile-form').onsubmit = async function(e) {
  e.preventDefault();
  const feedback = document.getElementById('profile-feedback');
  feedback.style.display = 'none';
  try {
    const email = document.getElementById('pf-email').value;
    const password = document.getElementById('pf-password').value;
    if (email) {
      await window.supabaseClient.auth.updateUser({ email });
    }
    if (password) {
      await window.supabaseClient.auth.updateUser({ password });
    }
    feedback.textContent = 'Profilo aggiornato!';
    feedback.style.background = '#e6faed';
    feedback.style.color = '#1a7f37';
    feedback.style.display = 'block';
    document.getElementById('profile-form').reset();
  } catch (err) {
    feedback.textContent = err.message || 'Errore aggiornamento profilo';
    feedback.style.background = '#ffeaea';
    feedback.style.color = '#d63c3c';
    feedback.style.display = 'block';
  }
};

// Mostra privacy
function showPrivacy() {
  alert('Informativa privacy: i dati sono trattati secondo la normativa vigente. Nessun dato viene ceduto a terzi. Per dettagli scrivere a info@evolutionsystem.it');
}
// Aggiorna un contratto
async function updateContract(id, fields) {
  const { error } = await window.supabaseClient.from('contracts').update(fields).eq('id', id);
  if (error) throw error;
}

// Elimina un contratto
async function deleteContract(id) {
  const { error } = await window.supabaseClient.from('contracts').delete().eq('id', id);
  if (error) throw error;
}

// Mostra modale modifica contratto
function openEditContractModal(contract) {
  const modal = document.createElement('div');
  modal.style = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:#0007;z-index:10000;display:flex;align-items:center;justify-content:center';
  modal.innerHTML = `
    <div style="background:#fff;padding:24px 18px;border-radius:8px;min-width:320px;max-width:96vw;box-shadow:0 2px 24px #0002">
      <h3>Modifica contratto</h3>
      <form id="edit-contract-form" style="display:flex;flex-direction:column;gap:10px">
        <input type="text" id="edit-employee" placeholder="Dipendente" value="${contract.employee_name||''}" required>
        <input type="text" id="edit-type" placeholder="Tipo Contratto" value="${contract.contract_type||''}" required>
        <input type="date" id="edit-start" value="${contract.start_date||''}" required>
        <input type="date" id="edit-end" value="${contract.end_date||''}" required>
        <select id="edit-renewable">
          <option value="true" ${contract.renewable?'selected':''}>Prorogabile</option>
          <option value="false" ${!contract.renewable?'selected':''}>Non prorogabile</option>
        </select>
        <input type="number" id="edit-renew-months" placeholder="Mesi Proroga" value="${contract.renew_months||''}">
        <input type="text" id="edit-renew-type" placeholder="Tipo Proroga" value="${contract.renew_type||''}">
        <input type="number" id="edit-renew-notice" placeholder="Preavviso (gg)" value="${contract.renew_notice||''}">
        <input type="number" id="edit-renew-count" placeholder="Proroghe fatte" value="${contract.renew_count||0}">
        <input type="text" id="edit-notes" placeholder="Note" value="${contract.notes||''}">
        <div style="display:flex;gap:8px;margin-top:8px">
          <button type="submit" style="background:#2d8a4e;color:#fff;padding:8px 16px;border:none;border-radius:4px;cursor:pointer">Salva</button>
          <button type="button" onclick="this.closest('.modal-edit-contract').remove()" style="background:#eee;padding:8px 16px;border:none;border-radius:4px;cursor:pointer">Annulla</button>
        </div>
      </form>
    </div>
  `;
  modal.className = 'modal-edit-contract';
  document.body.appendChild(modal);
  document.getElementById('edit-contract-form').onsubmit = async function(e) {
    e.preventDefault();
    try {
      await updateContract(contract.id, {
        employee_name: document.getElementById('edit-employee').value,
        contract_type: document.getElementById('edit-type').value,
        start_date: document.getElementById('edit-start').value,
        end_date: document.getElementById('edit-end').value,
        renewable: document.getElementById('edit-renewable').value === 'true',
        renew_months: parseInt(document.getElementById('edit-renew-months').value) || null,
        renew_type: document.getElementById('edit-renew-type').value,
        renew_notice: parseInt(document.getElementById('edit-renew-notice').value) || null,
        renew_count: parseInt(document.getElementById('edit-renew-count').value) || 0,
        notes: document.getElementById('edit-notes').value
      });
      modal.remove();
      await renderContracts();
    } catch (err) {
      alert('Errore salvataggio: ' + (err.message || err));
    }
  };
}

// Conferma eliminazione contratto
function confirmDeleteContract(id) {
  if (confirm('Vuoi davvero eliminare questo contratto?')) {
    deleteContract(id).then(renderContracts).catch(err => alert('Errore eliminazione: ' + (err.message || err)));
  }
}
// Funzioni CRUD aziende
async function loadCompanies() {
  const { data, error } = await window.supabaseClient.from('companies').select('*').order('created_at', { ascending: false });
  if (error) throw error;
  return data;
}

async function insertCompany(company) {
  const { data, error } = await window.supabaseClient.from('companies').insert([company]).select();
  if (error) throw error;
  return data;
}

// Render aziende
async function renderCompanies() {
  try {
    const companies = await loadCompanies();
    const wrap = document.getElementById('companies-table-wrap');
    const tbody = document.querySelector('#companies-table tbody');
    tbody.innerHTML = '';
    if (!companies.length) {
      wrap.style.display = '';
      tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;color:#888;padding:24px">Nessuna azienda presente</td></tr>';
      return;
    }
    companies.forEach(c => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${c.name || ''}</td>
        <td>${c.admin_email || ''}</td>
        <td>${c.created_at ? c.created_at.split('T')[0] : ''}</td>
      `;
      tbody.appendChild(tr);
    });
    wrap.style.display = '';
  } catch (err) {
    alert('Errore caricamento aziende: ' + (err.message || err));
  }
}

// Gestione form inserimento azienda
document.getElementById('company-form').onsubmit = async function(e) {
  e.preventDefault();
  const feedback = document.getElementById('company-feedback');
  feedback.style.display = 'none';
  try {
    await insertCompany({
      name: document.getElementById('cf-company-name').value,
      admin_email: document.getElementById('cf-company-email').value
    });
    feedback.textContent = 'Azienda aggiunta con successo!';
    feedback.style.background = '#e6faed';
    feedback.style.color = '#1a7f37';
    feedback.style.display = 'block';
    document.getElementById('company-form').reset();
    await renderCompanies();
  } catch (err) {

    feedback.style.background = '#ffeaea';
    feedback.style.color = '#d63c3c';
    feedback.style.display = 'block';
  }
};

// Gestione form inserimento contratto
document.getElementById('contract-form').onsubmit = async function(e) {

    await insertContract({

    });

<script>
// Gestione login
document.getElementById('login-form').onsubmit = async function(e) {
  e.preventDefault();
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  const errBox = document.getElementById('login-error');
  errBox.style.display = 'none';
  try {
    await login(email, password);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-shell').style.display = '';
    await renderContracts();
  } catch (err) {
    errBox.textContent = err.message || 'Errore di autenticazione';
    errBox.style.display = 'block';
  }
};

// Carica e mostra i contratti dopo il login
async function renderContracts() {
  try {
    const contracts = await loadContracts();
    const wrap = document.getElementById('contracts-table-wrap');
    const tbody = document.querySelector('#contracts-table tbody');
    tbody.innerHTML = '';
    if (!contracts.length) {
      wrap.style.display = '';
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#888;padding:24px">Nessun contratto presente</td></tr>';
      return;
    }
    contracts.forEach(c => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${c.employee_name || ''}</td>
        <td>${c.contract_type || ''}</td>
        <td>${c.start_date || ''}</td>
        <td>${c.end_date || ''}</td>
        <td>${c.renewable ? 'Sì' : 'No'}</td>
        <td>${c.notes || ''}</td>
        <td>
          <button onclick='openEditContractModal(${JSON.stringify(c)})' style="background:#2a5bd7;color:#fff;border:none;padding:4px 10px;border-radius:3px;cursor:pointer;font-size:14px;margin-right:4px">Modifica</button>
          <button onclick='confirmDeleteContract(${c.id})' style="background:#d63c3c;color:#fff;border:none;padding:4px 10px;border-radius:3px;cursor:pointer;font-size:14px">Elimina</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
    wrap.style.display = '';
  } catch (err) {
    alert('Errore caricamento contratti: ' + (err.message || err));
  }
  // Nascondi feedback dopo 3 secondi
  const feedback = document.getElementById('contract-feedback');
  if (feedback && feedback.style.display === 'block') {
    setTimeout(() => { feedback.style.display = 'none'; }, 3000);
  }
}

}
